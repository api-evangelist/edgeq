name: EdgeQ
description: 'EdgeQ is a fabless semiconductor company headquartered in Santa Clara,
  California, building a converged "Base Station-on-a-Chip" that integrates 5G, 6G,
  non-terrestrial network (NTN), custom waveform, CPU, and antenna-controller functions
  into a single software-defined silicon platform. Its programmable baseband targets
  small cells, private enterprise 5G, open RAN, satellite (LEO/MEO) communications,
  and AI-enabled physical devices. EdgeQ is a hardware and silicon provider surfaced
  as a portfolio company of Threshold Ventures; it publishes a corporate site, a 5G
  engineering blog, newsroom, and careers, but exposes no public developer portal,
  API, or machine-readable API specification.'
